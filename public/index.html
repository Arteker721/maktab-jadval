<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>Maktab Jadvali</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#6366f1">
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <link rel="apple-touch-icon" href="/icon.svg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <!-- ============ LOGIN ============ -->
  <div id="loginScreen" class="login-screen">
    <div class="login-box">
      <div class="login-logo">📚</div>
      <h1>Maktab Jadvali</h1>
      <p>Tizimga kirish yoki ro'yxatdan o'tish</p>

      <div class="login-tabs">
        <button class="login-tab active" data-tab="login">Kirish</button>
        <button class="login-tab" data-tab="register">Ro'yxatdan o'tish</button>
      </div>

      <form id="loginForm" class="login-form">
        <input type="text" id="loginUsername" placeholder="Username" required autocomplete="username">
        <input type="password" id="loginPassword" placeholder="Parol" required autocomplete="current-password">
        <button type="submit">Kirish →</button>
      </form>

      <form id="registerForm" class="login-form hidden">
        <input type="text" id="regName" placeholder="To'liq ism" required>
        <input type="text" id="regUsername" placeholder="Username" required autocomplete="username">
        <input type="password" id="regPassword" placeholder="Parol (kamida 4 belgi)" required minlength="4">
        <select id="regRole">
          <option value="student">O'quvchi</option>
          <option value="teacher">O'qituvchi</option>
        </select>
        <input type="text" id="regClass" placeholder="Sinf (masalan: 7-A)">
        <button type="submit">Ro'yxatdan o'tish →</button>
      </form>

      <div class="login-hint">
        <small>Demo: <b>admin</b> / <b>admin123</b></small>
      </div>
    </div>
  </div>

  <!-- ============ ASOSIY SAYT ============ -->
  <div id="app" class="app hidden">
    <header class="header">
      <div class="header-left">
        <div class="logo">📚</div>
        <div>
          <h1>Maktab Jadvali</h1>
          <p id="userInfo">—</p>
        </div>
      </div>
      <div class="header-right">
        <button id="darkModeBtn" class="icon-btn" title="Tungi rejim">🌙</button>
        <button id="logoutBtn" class="logout-btn">Chiqish</button>
      </div>
    </header>

    <!-- Yuqoridagi tabs (noutbuk uchun) -->
    <nav class="tabs">
      <button class="tab active" data-view="schedule">📅 Jadval</button>
      <button class="tab" data-view="homework">📝 Uy vazifasi</button>
      <button class="tab" data-view="notes">📌 Izohlar</button>
      <button class="tab" data-view="announcements">📢 E'lonlar</button>
      <button class="tab hidden" data-view="admin">⚙️ Admin</button>
    </nav>

    <!-- JADVAL -->
    <section id="view-schedule" class="view">
      <!-- Kun tanlash (telefon uchun) -->
      <div class="day-selector" id="daySelector">
        <button class="day-tab" data-day="Dushanba">Du</button>
        <button class="day-tab" data-day="Seshanba">Se</button>
        <button class="day-tab" data-day="Chorshanba">Cho</button>
        <button class="day-tab" data-day="Payshanba">Pay</button>
        <button class="day-tab" data-day="Juma">Ju</button>
        <button class="day-tab" data-day="Shanba">Sha</button>
      </div>

      <!-- BUGUNGI MA'LUMOT (telefon uchun) -->
      <div class="day-header" id="dayHeader">
        <div>
          <div class="day-header-date" id="dayHeaderDate">—</div>
          <div class="day-header-count" id="dayHeaderCount">— dars</div>
        </div>
        <div class="day-header-icon">📅</div>
      </div>

      <!-- Kunlik kartochkalar (telefon uchun) -->
      <div class="day-lessons" id="dayLessons"></div>

      <!-- Jadval (noutbuk uchun) -->
      <div class="controls desktop-only">
        <input type="text" id="searchInput" placeholder="🔍 Fan yoki o'qituvchi...">
        <select id="dayFilter">
          <option value="all">Barcha kunlar</option>
          <option value="Dushanba">Dushanba</option>
          <option value="Seshanba">Seshanba</option>
          <option value="Chorshanba">Chorshanba</option>
          <option value="Payshanba">Payshanba</option>
          <option value="Juma">Juma</option>
          <option value="Shanba">Shanba</option>
        </select>
        <button id="addLessonBtn" class="add-btn hidden">➕ Dars qo'shish</button>
      </div>
      <div class="table-section desktop-only">
        <table id="scheduleTable">
          <thead>
            <tr>
              <th>Vaqt</th>
              <th>Dushanba</th>
              <th>Seshanba</th>
              <th>Chorshanba</th>
              <th>Payshanba</th>
              <th>Juma</th>
              <th>Shanba</th>
            </tr>
          </thead>
          <tbody id="scheduleBody"></tbody>
        </table>
      </div>
    </section>

    <!-- UY VAZIFASI -->
    <section id="view-homework" class="view hidden">
      <h2>📝 Uy vazifalari</h2>
      <div id="homeworkList" class="list-container"></div>
      <button id="addHwBtn" class="add-btn hidden" style="margin-top:20px;">➕ Vazifa qo'shish</button>
    </section>

    <!-- IZOHLAR -->
    <section id="view-notes" class="view hidden">
      <h2>📌 Shaxsiy izohlar</h2>
      <form id="noteForm" class="inline-form">
        <input type="text" id="noteInput" placeholder="Yangi izoh yozing..." required>
        <button type="submit">Qo'shish</button>
      </form>
      <div id="notesList" class="list-container"></div>
    </section>

    <!-- E'LONLAR -->
    <section id="view-announcements" class="view hidden">
      <h2>📢 E'lonlar</h2>
      <div id="announcementsList" class="list-container"></div>
      <button id="addAnnBtn" class="add-btn hidden" style="margin-top:20px;">➕ E'lon qo'shish</button>
    </section>

    <!-- ADMIN -->
    <section id="view-admin" class="view hidden">
      <h2>⚙️ Admin Panel</h2>
      <div class="admin-grid">
        <div class="admin-card">
          <h3>👥 Foydalanuvchilar</h3>
          <div id="usersList"></div>
        </div>
        <div class="admin-card">
          <h3>📚 Fanlar</h3>
          <div id="subjectsList"></div>
          <button id="addSubjectBtn" class="small-btn">➕ Fan qo'shish</button>
        </div>
      </div>
    </section>
  </div>

  <!-- ============ PASTKI MENYU ============ -->
  <nav id="bottomNav" class="bottom-nav hidden">
    <button class="bottom-nav-item active" data-view="schedule">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
      </svg>
      <span>Jadval</span>
    </button>
    <button class="bottom-nav-item" data-view="homework">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/>
      </svg>
      <span>Vazifa</span>
    </button>
    <button class="bottom-nav-item" data-view="notes">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/>
      </svg>
      <span>Izohlar</span>
    </button>
    <button class="bottom-nav-item" data-view="announcements">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 11l19-9-9 19-2-8-8-2z"/>
      </svg>
      <span>E'lonlar</span>
    </button>
    <button class="bottom-nav-item hidden" data-view="admin" id="bottomNavAdmin">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
      <span>Admin</span>
    </button>
  </nav>

  <!-- FAB -->
  <button id="fabBtn" class="fab-btn hidden">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
    </svg>
  </button>

  <!-- MODAL -->
  <div id="modal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modalTitle">Qo'shish</h2>
        <button id="closeModal" class="close-btn">✕</button>
      </div>
      <form id="modalForm"></form>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="script.js"></script>
</body>
</html>
